# Elysian Horizon Discord 邀请状态监控
# 每次运行只检查一次，避免长时间 job 被 GitHub 取消或排队卡住。

name: Check Discord Invite

on:
  # 每 5 分钟检查一次
  # GitHub Actions 的 schedule 可能会有轻微延迟，这是平台本身的特性。
  schedule:
    - cron: "*/5 * * * *"

  # 允许手动测试
  workflow_dispatch:

  # 修改本文件后自动跑一次，方便确认恢复
  push:
    paths:
      - ".github/workflows/check.yml"

permissions:
  contents: write

concurrency:
  group: invite-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查邀请码并发送通知
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python check_invite.py

      - name: 保存监控状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet state.json; then
            echo "状态没有变化，无需提交。"
            exit 0
          fi

          git add state.json
          git commit -m "chore: 更新邀请码监控状态 [skip ci]"

          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi

            echo "推送失败，第 ${attempt} 次重试..."
            sleep $((attempt * 2))
          done

          echo "状态提交失败。"
          exit 1
